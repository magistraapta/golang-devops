global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Example: scraping a web application
  - job_name: 'golang-devops'
    static_configs:
      - targets: ['server:8080']
    metrics_path: /metrics
    scrape_interval: 5s


